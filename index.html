<div id="contenedor-samuray" style="text-align: center; margin: 40px auto; max-width: 400px; padding: 20px; border: 2px dashed #00ffcc; border-radius: 15px; background-color: #111;">
    
    <button id="btn-samuray" onclick="playSamuray()" style="background: linear-gradient(45deg, #ff0055, #00ffcc); color: #000; font-family: 'Impact', 'Arial Black', sans-serif; font-size: 24px; padding: 15px 30px; border: none; border-radius: 50px; cursor: pointer; box-shadow: 0 0 20px rgba(0,255,204,0.6); text-transform: uppercase; transition: transform 0.1s; width: 100%;">
        🔥 ¡Suena Samuray! 🔥
    </button>
    
    <p style="color: #00ffcc; font-family: 'Courier New', monospace; margin-top: 15px; font-size: 20px; font-weight: bold; letter-spacing: 3px; text-shadow: 0 0 10px #00ffcc;">
        ¡CU-CU-CU-CUMBIA!
    </p>

    <audio id="audio-samuray" src="https://actions.google.com/sounds/v1/music/latin_percussion_reggae.ogg"></audio>

</div>

<script>
function playSamuray() {
    var audio = document.getElementById('audio-samuray');
    var boton = document.getElementById('btn-samuray');
    
    if (audio) {
        // Efecto visual rápido de pulsación
        boton.style.transform = 'scale(0.95)';
        setTimeout(function(){ boton.style.transform = 'scale(1)'; }, 100);
        
        // Reinicia y reproduce con sabor
        audio.currentTime = 0; 
        audio.play().catch(function(error) {
            console.log("Error al reproducir: ", error);
        });
    }
}
</script>
